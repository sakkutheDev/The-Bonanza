<!--This is the Add Profile Page HTML code with Header part for the billfold bananza billing Webside Made By Saqlain Khan :) -->
<!DOCTYPE html>
<html lang="en">
<head>

    <!--Ensures correct display of text characters: Browsers need to know the encoding to interpret the codes correctly and display the intended characters.-->
    <meta charset="UTF-8">
    <!--it specifically deals with how a web page is displayed on various devices, particularly mobile devices.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>

    <!--CSS File-->
    <link rel="stylesheet" href="css code/addprofile.css">
 
    <link href='https://fonts.googleapis.com/css?family=Slackey' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>
    <!--the navbar link-->
    <link rel='stylesheet' href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'>

    
    <script defer src="addprofile.js"></script>
</head>

<body>
    <!--Header Starts Here-->
    <div class="header">
        <div class="left_header">
            <p><span class="color1">Bill</span><span class="color2">fold</span></p>
           
        </div>
      
    </div>
    <!--Header ends Here-->








    


<p class="heading">Create a Restaurant Profile</p>

<div class="main_div">

  <div class="file-upload-form">
    <div class="profile_photo_div">
        <img src="" class="profile_img" id="profile_img2">
    </div>

    <label class="category_img_n">
        <input type="file" accept="image/*" id="itemImage">
    </label>

    <div class="profile_div">
        <div class="d1">
            <p class="res_name">Restaurant Name :</p>
            <input type="text" class="res_name_box" id="restaurant_name" placeholder="Eg: 7 Star Restaurant">
        </div>

        <div class="d1">
            <p class="res_name">Restaurant Address :</p>
            <input type="textarea" class="res_name_box_a" id="restaurant_address" placeholder="Eg: #18 2nd cross Frazer town Bangalore 560056, Karnataka">
        </div>

        <div class="d1">
            <p class="res_name">Restaurant Number :</p>
            <input type="text" class="res_name_box" id="restaurant_number" placeholder="Eg: +91 8088654281">
        </div>

        <div class="d1">
            <button class="print_btn" id="updateButton">Add Profile</button>
        </div>
    </div>
</div>

  </div>
</div>
</body>
</html>
